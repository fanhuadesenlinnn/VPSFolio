name: Build Chrome Extension
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: npm test
      - name: Build extension ZIP
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
        run: npm run build
      - name: Validate built package
        run: npm run validate
      - name: Upload installable artifact
        uses: actions/upload-artifact@v4
        with:
          name: VPSFolio-Chrome-Extension
          path: dist/VPSFolio-Chrome-Extension.zip
          if-no-files-found: error
